version: "3"

includes:
  utils:
    internal: true
    taskfile: "../../tools/yscope-dev-utils/exports/taskfiles/utils/utils.yaml"

vars:
  G_DOCKER_IMAGE_CHECKSUMS_DIR: "{{.G_OUTPUT_DIR}}/docker-images/checksums"
  G_DOCKER_IMAGE_SCRIPT_DIR: "{{.G_PROJECT_SRC_DIR}}/scripts/docker_images"

  G_DOCKER_IMAGE_ENGINES:
    - "clickhouse"
    - "clp"
    - "elasticsearch"
    # Note: Presto-related images currently fail to build and are pending fixes.
    #- "presto_clp"
    #- "presto_parquet"
    - "sparksql"
    - "zstandard"

tasks:
  build:
    deps:
      - task: ":init"
      - task: "init"
    cmds:
      - task: "build-all-parallel"

  init:
    internal: true
    silent: true
    run: "once"
    cmds:
      - "mkdir -p '{{.G_DOCKER_IMAGE_CHECKSUMS_DIR}}'"

  build-all-parallel:
    internal: true
    run: "once"
    deps:
      - for:
          var: "G_DOCKER_IMAGE_ENGINES"
        task: "build-single-image"
        vars:
          ENGINE_NAME: "{{.ITEM}}"

  build-single-image:
    # Builds Docker image for the given engine, validating and (re)computing its checksum
    # This task orchestrates three stages
    #   - Validation: Ensure the current local image matches the stored checksum by regenerating and
    #                 hashing its `docker inspect` metadata. If the checksum mismatches, the
    #                 checksum file is deleted so downstream stages will run.
    #   - Build: Build the Docker image from the current Dockerfile and project sources.
    #   - Compute: Re-inspect the newly built image and update the checksum file.
    #
    # @param {string} ENGINE_NAME
    internal: true
    label: "{{.TASK}}:{{.ENGINE_NAME}}"
    vars:
      CHECKSUM_FILE: "{{.G_DOCKER_IMAGE_CHECKSUMS_DIR}}/{{.ENGINE_NAME}}.md5"
      METADATA_FILE: "{{.G_DOCKER_IMAGE_CHECKSUMS_DIR}}/{{.ENGINE_NAME}}.json"

      INSPECT_CMD: |-
        uv run "{{.G_DOCKER_IMAGE_SCRIPT_DIR}}/inspect.py" \
          --engine-name {{.ENGINE_NAME}} \
          --metadata-file "{{.METADATA_FILE}}" \
          --id-only
    requires:
      vars: ["ENGINE_NAME"]
    sources:
      - "{{.G_PROJECT_SRC_DIR}}/**/*"
      - "{{.ROOT_DIR}}/Taskfile.yaml"
      - "{{.ROOT_DIR}}/taskfiles/**/*.yaml"
      - "{{.ROOT_DIR}}/tools/yscope-dev-utils/exports/taskfiles/**/*.yaml"
      - exclude: "{{.G_PROJECT_SRC_DIR}}/build/**/*"
      - exclude: "{{.G_PROJECT_SRC_DIR}}/config/**/*"
      # This must come after the exclude
      - "{{.G_PROJECT_SRC_DIR}}/config/docker-images/{{.ENGINE_NAME}}.Dockerfile"
    generates: ["{{.CHECKSUM_FILE}}"]
    deps:
      - task: "validate-single-image-checksum"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INSPECT_CMD: "{{.INSPECT_CMD}}"
          METADATA_FILE: "{{.METADATA_FILE}}"
    cmds:
      - |-
        uv run "{{.G_DOCKER_IMAGE_SCRIPT_DIR}}/build.py" --engine-name {{.ENGINE_NAME}}
        {{.INSPECT_CMD}}

      # This command must be last
      - task: "utils:checksum:compute"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.METADATA_FILE}}"]

  validate-single-image-checksum:
    # Validates the checksum for a single engine’s image by regenerating its inspect metadata and
    # comparing its hash against the stored checksum. If the checksum mismatches, this task deletes
    # the checksum file (via `utils:checksum:validate`), allowing dependent tasks that list it under
    # `generates` to rerun automatically.
    #
    # This validation process needs to be a separate task by itself, because image inspection and
    # checksum computing can not run concurrently in the `deps:` sections of dependent tasks.
    #
    # @param {string} CHECKSUM_FILE File containing the hash of `METADATA_FILE`.
    # @param {string} INSPECT_CMD Command that inspects the image and writes metadata to
    # `METADATA_FILE`.
    # @param {string} METADATA_FILE JSON file generated by `INSPECT_CMD` containing the metadata.
    internal: true
    requires:
      vars: ["CHECKSUM_FILE", "INSPECT_CMD", "METADATA_FILE"]
    cmds:
      # Task may fail if the image does not exist.
      - "{{.INSPECT_CMD}} || rm -f '{{.METADATA_FILE}}'"
      - task: "utils:checksum:validate"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.METADATA_FILE}}"]
