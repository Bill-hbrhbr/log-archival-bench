version: "3"

includes:
  utils:
    internal: true
    taskfile: "../../tools/yscope-dev-utils/exports/taskfiles/utils/utils.yaml"

vars:
  G_DOCKER_IMAGE_CHECKSUMS_DIR: "{{.G_OUTPUT_DIR}}/docker-images/checksums"
  G_DOCKER_IMAGE_SCRIPT_DIR: "{{.G_PROJECT_SRC_DIR}}/scripts/docker_images"

  G_DOCKER_IMAGE_ENGINES:
    - "clickhouse"
    - "clp"
    - "elasticsearch"
    # Note: Presto-related images currently fail to build and are pending fixes.
    #- "presto_clp"
    #- "presto_parquet"
    - "sparksql"
    - "zstandard"

tasks:
  build:
    deps:
      - task: ":init"
      - task: "init"
    cmds:
      - task: "build-all-parallel"

  init:
    internal: true
    silent: true
    run: "once"
    cmds:
      - "mkdir -p '{{.G_DOCKER_IMAGE_CHECKSUMS_DIR}}'"

  build-all-parallel:
    internal: true
    run: "once"
    deps:
      - for:
          var: "G_DOCKER_IMAGE_ENGINES"
        task: "build-single-image"
        vars:
          ENGINE_NAME: "{{.ITEM}}"

  build-single-image:
    internal: true
    label: "{{.TASK}}:{{.ENGINE_NAME}}"
    vars:
      CHECKSUM_FILE: "{{.G_DOCKER_IMAGE_CHECKSUMS_DIR}}/{{.ENGINE_NAME}}.md5"
      METADATA_FILE: "{{.G_DOCKER_IMAGE_CHECKSUMS_DIR}}/{{.ENGINE_NAME}}.json"

      INSPECT_CMD: |-
        uv run "{{.G_DOCKER_IMAGE_SCRIPT_DIR}}/inspect.py" \
          --engine-name {{.ENGINE_NAME}} \
          --metadata-file "{{.METADATA_FILE}}" \
          --trim
    requires:
      vars: ["ENGINE_NAME"]
    sources:
      - "{{.G_PROJECT_SRC_DIR}}/**/*.py"
      - "{{.TASKFILE}}"
      - exclude: "{{.G_PROJECT_SRC_DIR}}/build/**/*"
      - exclude: "{{.G_PROJECT_SRC_DIR}}/config/**/*"
      # This must come after the exclude
      - "{{.G_PROJECT_SRC_DIR}}/config/docker-images/{{.ENGINE_NAME}}.Dockerfile"
    generates: ["{{.CHECKSUM_FILE}}"]
    deps:
      - task: "validate-single-image-checksum"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INSPECT_CMD: "{{.INSPECT_CMD}}"
          METADATA_FILE: "{{.METADATA_FILE}}"
    cmds:
      - "uv run '{{.G_DOCKER_IMAGE_SCRIPT_DIR}}/build.py' --engine-name {{.ENGINE_NAME}}"

      # This command must be last
      - task: "compute-single-image-checksum"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INSPECT_CMD: "{{.INSPECT_CMD}}"
          METADATA_FILE: "{{.METADATA_FILE}}"

  validate-single-image-checksum:
    internal: true
    requires:
      vars: ["CHECKSUM_FILE", "INSPECT_CMD", "METADATA_FILE"]
    cmds:
      # Dumps metadata of the current image. May fail if the image does not exist.
      - "{{.INSPECT_CMD}} || true"
      - task: "utils:checksum:validate"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.METADATA_FILE}}"]

  compute-single-image-checksum:
    internal: true
    requires:
      vars: ["CHECKSUM_FILE", "INSPECT_CMD", "METADATA_FILE"]
    cmds:
      # Dumps metadata of the newly created image. This command should not fail.
      - "{{.INSPECT_CMD}}"
      - task: "utils:checksum:compute"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.METADATA_FILE}}"]
