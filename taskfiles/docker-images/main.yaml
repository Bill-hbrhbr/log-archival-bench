version: "3"

includes:
  utils:
    internal: true
    taskfile: "../../tools/yscope-dev-utils/exports/taskfiles/utils/utils.yaml"

vars:
  G_DOCKER_IMAGE_SERVICES:
    - "clickhouse"
    - "clp"
    - "elasticsearch"
    # Note: Presto-related images currently fail to build and are pending fixes.
    #- "presto_clp"
    #- "presto_parquet"
    - "sparksql"
    - "zstandard"
  G_DOCKER_IMAGE_SCRIPT_DIR: "{{.G_PROJECT_SRC_DIR}}/scripts/docker_images"

tasks:
  build:
    run: "once"
    deps:
      - for:
          var: "G_DOCKER_IMAGE_SERVICES"
        task: "build-single-image"
        vars:
          SERVICE_NAME: "{{.ITEM}}"

  build-single-image:
    internal: true
    label: "{{.TASK}}:{{.SERVICE_NAME}}"
    requires:
      vars: ["SERVICE_NAME"]
    run: "when_changed"
    cmds:
      - "uv run '{{.G_DOCKER_IMAGE_SCRIPT_DIR}}/build.py' --service-name {{.SERVICE_NAME}}"
